{{ define "main" }}
<div class="main-container">
  <article class="page single">
    <header class="page-header">
      <h1 class="article-title">{{ .Title }}</h1>
      {{ with .Description }}<p class="article-subtitle">{{ . }}</p>{{ end }}
    </header>
    <div class="article-content">
      {{ partial "books-list.html" . }}
    </div>
  </article>
</div>
{{ end }}
