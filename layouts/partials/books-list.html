{{ if .Site.Data.books }}
<div class="books-grid">
  {{ range .Site.Data.books }}
  <a class="books-card" href="{{ .url}}" target="_blank" rel="noopener noreferrer">
    <div class="books-card__icon">
      {{ if strings.HasPrefix .icon "http" }}
        <img src="{{ .icon }}" alt="{{ .title }}" loading="lazy">
{{ else }}
        <span>{{ .icon }}</span>
{{ end }}
    </div>
    <div class="books-card__body">
      <span class="books-card__title">{{ .title }}</span>
      {{ if .description }}
      <span class="books-card__desc">{{ .description }}</span>
      {{ end }}
    </div>
  </a>
  {{ end }}
</div>
{{ else }}
<p>暂无资源</p>
{{ end }}

<style>
.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1.5rem;
  margin: 2rem 0;
}

.books-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.2rem;
  
  /* 亚克力特效核心 */
  background: rgba(var(--card-background-rgb), 0.7); /* 使用透明度 */
  backdrop-filter: blur(12px); /* 毛玻璃模糊效果 */
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1); /* 轻微边框 */
  
  border-radius: 16px; /* 稍微加大圆角，更符合亚克力质感 */
  text-decoration: none;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  color: var(--body-text-color);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.books-card:hover {
  transform: translateY(-8px);
  background: rgba(var(--card-background-rgb), 0.85); /* 悬浮时增加不透明度 */
  border-color: var(--accent-color);
  box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.2);
}

.books-card:active {
  transform: translateY(-2px);
}

/* 确保颜色兼容性 */
:root {
  --card-background-rgb: 255, 255, 255; /* 默认浅色模式RGB */
}
[data-scheme="dark"] {
  --card-background-rgb: 40, 40, 40; /* 深色模式背景RGB */
}

.books-card__icon img {
  width: 48px;
  height: 48px;
  object-fit: contain;
  padding: 6px;
  border-radius: 8px;
  background: rgba(255,255,255,0.1); /* 图标底色也保持通透 */
}

.books-card__icon span {
  font-size: 2rem;
}

.books-card__title {
  display: block;
  font-weight: 600;
  font-size: 1.7rem; /* 标题加大 */
  margin-bottom: 0.25rem;
}

.books-card__desc {
  display: block;
  font-size: 1.3rem; /* 描述加大 */
  color: var(--secondary-text-color);
  line-height: 1.5;   /* 适当增大行高，提升易读性 */
}
</style>
