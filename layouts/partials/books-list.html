{{ if .Site.Data.books }}
<div class="books-grid">
  {{ range .Site.Data.books }}
  <a class="books-card" href="{{ .url}}" target="_blank" rel="noopener noreferrer">
    <div class="books-card__icon">
      {{ if strings.HasPrefix .icon "http" }}
        <img src="{{ .icon }}" alt="{{ .title }}" loading="lazy">
{{ else }}
        <span>{{ .icon }}</span>
{{ end }}
    </div>
    <div class="books-card__body">
      <span class="books-card__title">{{ .title }}</span>
      {{ if .description }}
      <span class="books-card__desc">{{ .description }}</span>
      {{ end }}
    </div>
  </a>
  {{ end }}
</div>
{{ else }}
<p>暂无资源</p>
{{ end }}

<style>
.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1.2rem;
  margin: 2rem 0;
}

.books-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.2rem;
  background-color: var(--card-background);
  border: 1px solid var(--card-border-color);
  border-radius: 12px;
  text-decoration: none;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  color: var(--body-text-color);
}
.books-card:hover {
  transform: translateY(-5px);
  border-color: var(--accent-color);
  box-shadow: var(--shadow-l);
}

.books-card__icon {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.books-card__icon img {



  width: 48px;
  height: 48px;
  object-fit: contain;
  padding: 6px;
  border-radius: 8px;
  background-color: var(--card-background);
  border: 1px solid var(--card-border-color);
}

.books-card__icon span {
  font-size: 2rem;
}

.books-card__title {
  display: block;
  font-weight: 600;
  margin-bottom: 0.25rem;
}

.books-card__desc {
  display: block;
  font-size: 0.95rem; /* 从 0.85rem 增大到 0.95rem */
  color: var(--secondary-text-color);
  line-height: 1.5;   /* 适当增大行高，提升易读性 */
}
</style>
